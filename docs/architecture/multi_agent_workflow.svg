<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">InvesAgent 多 Agent 工作流</title>
  <desc id="desc">展示用户输入经过外层 Chat Graph、内层 Research Graph、专业 Agent、MCP 工具和数据源后生成 Markdown、HTML 或 PDF 研究输出的整体流程。</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#314256"/>
    </marker>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17415f"/>
      <stop offset="1" stop-color="#276a69"/>
    </linearGradient>
    <style>
      .bg { fill: #f6f7f2; }
      .header-title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #dce8e4; }
      .group-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263442; }
      .node-title { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2d3b; }
      .node-text { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .small { font: 400 11px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #56677a; }
      .label { font: 700 11px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .lane { fill: #edf3f1; stroke: #cfd8d3; stroke-width: 1; rx: 14; }
      .node { fill: #ffffff; stroke: #9fb1ac; stroke-width: 1.5; rx: 10; }
      .decision { fill: #fff8df; stroke: #d2a842; stroke-width: 1.5; }
      .tool { fill: #eef5ff; stroke: #8aa9d6; stroke-width: 1.4; rx: 10; }
      .data { fill: #f0f7ea; stroke: #95b97c; stroke-width: 1.4; rx: 10; }
      .output { fill: #fff0ec; stroke: #d79b86; stroke-width: 1.4; rx: 10; }
      .line { fill: none; stroke: #314256; stroke-width: 1.7; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #667b8f; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #7b8b9b; stroke-width: 1.1; marker-end: url(#arrow); }
      .label-bg { fill: #f6f7f2; stroke: #d7ded9; stroke-width: 0.8; rx: 8; }
      .legend-pill { fill: #276a69; rx: 9; }
      .legend-text { font: 700 11px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="960"/>
  <rect x="0" y="0" width="1280" height="86" fill="url(#headerGradient)"/>
  <text class="header-title" x="40" y="40">InvesAgent 多 Agent 系统流程图</text>
  <text class="subtitle" x="40" y="64">外层判断是否进入投资研究；内层按 task_plan 调度数据收集、专业分析、复核、报告生成与审查。</text>

  <!-- 外层 Chat Graph -->
  <rect class="lane" x="34" y="112" width="1212" height="178"/>
  <text class="group-title" x="58" y="144">外层 Chat Graph：入口意图判断</text>

  <rect class="node" x="70" y="178" width="170" height="76"/>
  <text class="node-title center" x="155" y="207">用户输入</text>
  <text class="node-text center" x="155" y="231">自然语言问题</text>

  <rect class="node" x="300" y="170" width="220" height="92"/>
  <text class="node-title center" x="410" y="198">General Assistant</text>
  <text class="node-text center" x="410" y="223">入口意图判断</text>
  <text class="small center" x="410" y="244">输出 route / intent</text>

  <polygon class="decision" points="650,164 758,216 650,268 542,216"/>
  <text class="node-title center" x="650" y="207">是否投资</text>
  <text class="node-title center" x="650" y="229">研究任务？</text>

  <rect class="output" x="830" y="144" width="210" height="76"/>
  <text class="node-title center" x="935" y="174">一般回答</text>
  <text class="node-text center" x="935" y="198">普通聊天 / 概念解释</text>

  <rect class="node" x="830" y="234" width="210" height="76"/>
  <text class="node-title center" x="935" y="264">Research Graph</text>
  <text class="node-text center" x="935" y="288">进入内层研究流程</text>

  <path class="line" d="M240 216 L300 216"/>
  <path class="line" d="M520 216 L542 216"/>
  <path class="line" d="M758 199 L830 182"/>
  <rect class="label-bg" x="784" y="174" width="34" height="20"/>
  <text class="label center" x="801" y="184">否</text>
  <path class="line" d="M758 233 L830 272"/>
  <rect class="label-bg" x="784" y="250" width="34" height="20"/>
  <text class="label center" x="801" y="260">是</text>

  <!-- 内层 Research Graph -->
  <rect class="lane" x="34" y="330" width="1212" height="430"/>
  <text class="group-title" x="58" y="362">内层 Research Graph：多 Agent 投资研究流程</text>

  <rect class="node" x="70" y="430" width="250" height="116"/>
  <text class="node-title center" x="195" y="458">Investment Task Manager</text>
  <text class="node-text center" x="195" y="483">根据 query 生成 task_plan</text>
  <text class="node-text center" x="195" y="504">规划 Agent 与 MCP 工具调用</text>
  <text class="small center" x="195" y="525">确认标的、时间、重点完整</text>

  <rect class="node" x="430" y="430" width="250" height="116"/>
  <text class="node-title center" x="555" y="458">Data Collector</text>
  <text class="node-text center" x="555" y="483">信息完整后执行</text>
  <text class="node-text center" x="555" y="504">解析标的 / 行业股票池</text>
  <text class="small center" x="555" y="525">准备后续分析上下文</text>

  <rect class="node" x="790" y="374" width="210" height="74"/>
  <text class="node-title center" x="895" y="403">行业分析</text>
  <text class="node-text center" x="895" y="427">Industry Analyst</text>

  <rect class="node" x="790" y="466" width="210" height="74"/>
  <text class="node-title center" x="895" y="495">量价分析</text>
  <text class="node-text center" x="895" y="519">Price Volume Analyst</text>

  <rect class="node" x="790" y="558" width="210" height="74"/>
  <text class="node-title center" x="895" y="587">估值分析</text>
  <text class="node-text center" x="895" y="611">Valuation Analyst</text>

  <rect class="node" x="790" y="650" width="210" height="74"/>
  <text class="node-title center" x="895" y="679">基本面分析</text>
  <text class="node-text center" x="895" y="703">Fundamental Analyst</text>

  <rect class="node" x="1070" y="382" width="150" height="84"/>
  <text class="node-title center" x="1145" y="411">结果复核</text>
  <text class="node-text center" x="1145" y="435">检查数据缺口</text>
  <text class="small center" x="1145" y="455">必要时重试</text>

  <rect class="node" x="1070" y="500" width="150" height="84"/>
  <text class="node-title center" x="1145" y="529">研究报告 Agent</text>
  <text class="node-text center" x="1145" y="553">整合分析结果</text>
  <text class="small center" x="1145" y="573">生成报告正文</text>

  <rect class="node" x="1070" y="618" width="150" height="84"/>
  <text class="node-title center" x="1145" y="647">审查</text>
  <text class="node-text center" x="1145" y="671">Reviewer</text>
  <text class="small center" x="1145" y="691">质量与合规检查</text>

  <rect class="output" x="1042" y="724" width="206" height="64"/>
  <text class="node-title center" x="1145" y="748">最终输出</text>
  <text class="node-text center" x="1145" y="770">Markdown / HTML / PDF</text>

  <path class="line" d="M935 310 L935 330"/>
  <path class="line" d="M320 488 L430 488"/>
  <path class="line" d="M680 488 L735 488 L735 411 L790 411"/>
  <path class="line" d="M680 488 L790 503"/>
  <path class="line" d="M680 488 L735 488 L735 595 L790 595"/>
  <path class="line" d="M680 488 L735 488 L735 687 L790 687"/>

  <path class="thin" d="M1000 411 L1040 411 L1040 424 L1070 424"/>
  <path class="thin" d="M1000 503 L1040 503 L1040 424 L1070 424"/>
  <path class="thin" d="M1000 595 L1040 595 L1040 424 L1070 424"/>
  <path class="thin" d="M1000 687 L1040 687 L1040 424 L1070 424"/>
  <path class="line" d="M1145 466 L1145 500"/>
  <path class="line" d="M1145 584 L1145 618"/>
  <path class="line" d="M1145 702 L1145 724"/>

  <!-- MCP 层 -->
  <rect class="lane" x="34" y="800" width="1212" height="118"/>
  <text class="group-title" x="58" y="832">MCP 工具与数据源</text>

  <rect class="data" x="445" y="858" width="220" height="44"/>
  <text class="node-title center" x="555" y="880">Tushare / AKShare 等</text>

  <rect class="tool" x="785" y="858" width="220" height="44"/>
  <text class="node-title center" x="895" y="880">InvesAgent MCP</text>

  <rect class="tool" x="1045" y="858" width="170" height="44"/>
  <text class="node-title center" x="1130" y="880">离线/在线 MCP</text>

  <path class="dash" d="M555 546 L555 858"/>
  <path class="dash" d="M895 724 L895 858"/>
  <path class="line" d="M665 880 L785 880"/>
  <path class="line" d="M1005 880 L1045 880"/>

  <!-- 图例 -->
  <rect class="legend-pill" x="58" y="866" width="80" height="22"/>
  <text class="legend-text" x="98" y="877">图例</text>
  <rect class="node" x="158" y="854" width="78" height="24"/>
  <text class="small center" x="197" y="866">Agent</text>
  <rect class="tool" x="158" y="886" width="78" height="24"/>
  <text class="small center" x="197" y="898">工具</text>
  <rect class="data" x="252" y="854" width="78" height="24"/>
  <text class="small center" x="291" y="866">数据源</text>
  <rect class="output" x="252" y="886" width="78" height="24"/>
  <text class="small center" x="291" y="898">输出</text>
</svg>
