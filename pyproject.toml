[project]
name = "tushare-ai-financial-agent"
version = "0.1.0"
description = "A learning-first MCP and Agent project for Chinese A-share financial analysis with Tushare."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "openai>=1.80.0",
    "openai-agents>=0.0.15",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "tushare>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
tushare-financial-analyst = "src.mcp_server.server:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
